<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Card Catalog — Recipes</title>
<meta name="description" content="A minimal recipe catalog with search and one-tap shopping list creation, built for the iOS Reminders app." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-row">
      <h1>Card Catalog</h1>
      <nav class="header-actions" aria-label="Actions">
        <a class="btn" href="add-recipe.html">+ Add recipe</a>
        <a class="icon-btn" href="shopping-list.html" aria-label="Shopping list">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>
            <path d="M3 3h2l2.4 12.2a1.5 1.5 0 0 0 1.5 1.3h8.4a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/>
          </svg>
          <span class="count-badge" id="list-count" hidden>0</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- RECIPES VIEW -->
  <section id="view-recipes">
    <div class="search-strip">
      <input type="search" id="search-input" placeholder="Search recipes, ingredients, or tags…" aria-label="Search recipes" />
    </div>
    <div class="chip-row" id="tag-filters" aria-label="Filter by tag"></div>
    <p class="result-meta" id="result-meta"></p>
    <div class="card-grid" id="card-grid"></div>
    <div class="empty-state" id="empty-state" hidden>Nothing in the drawer matches that search.</div>
  </section>

  <footer class="site-footer">With ❤️ from <a href="https://atharva-bhagwat.github.io/" target="_blank" rel="noopener noreferrer">Atharva</a> and <a href="https://www.yashraut.com/" target="_blank" rel="noopener noreferrer">Yash</a> · Made with <a href="https://claude.ai/" target="_blank" rel="noopener noreferrer">Claude</a>.</footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
